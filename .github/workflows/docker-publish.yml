name: Build Docker image and standalone binaries

# 触发条件：
# - push 到 main 分支
# - 打 v* 形式的 tag（如 v1.0.0）
# - 手动触发
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve GHCR image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-binaries:
    name: Binary (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix web ci

      - name: Check logging and request handling
        run: |
          npm run check:logging
          npm run check:models-transport
          npm run check:proxy-routing
          npm run check:opencode-compat
          npm run check:proxy-rate-limit
          npm run check:response-lifecycle

      - name: Build standalone distribution
        run: npm run build:binary -- ${{ matrix.platform }}

      - name: Smoke test native binary
        run: npm run check:binary -- releases/opencode-proxy-hub-${{ matrix.platform }}

      - name: Package binary and web console
        working-directory: releases
        run: |
          tar -czf opencode-proxy-hub-${{ matrix.platform }}.tar.gz opencode-proxy-hub-${{ matrix.platform }}
          sha256sum opencode-proxy-hub-${{ matrix.platform }}.tar.gz > opencode-proxy-hub-${{ matrix.platform }}.tar.gz.sha256

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-proxy-hub-${{ matrix.platform }}
          path: |
            releases/opencode-proxy-hub-${{ matrix.platform }}.tar.gz
            releases/opencode-proxy-hub-${{ matrix.platform }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
